name: Android Build & Release (APK & AAB)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Target Build Type'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'debug'
          - 'release'
          - 'bundle'
      version_name:
        description: 'Version Name (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version Code (e.g., 1)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🔑 Configure Keystores
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Restore debug keystore from repository base64 file
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Configure release keystore if secret is provided
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "keystore_configured=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No release keystore secret provided. Debug signing will be used."
            echo "keystore_configured=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🚀 Build Debug APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'debug' || inputs.build_type == '' }}
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ inputs.version_code || '1' }} \
            -PversionName=${{ inputs.version_name || '1.0.0' }} \
            --stacktrace

      - name: 📦 Build Release APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' || github.event_name == 'push' }}
        continue-on-error: true
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ inputs.version_code || '1' }} \
            -PversionName=${{ inputs.version_name || '1.0.0' }} \
            --stacktrace

      - name: 🌐 Build Google Play Bundle (AAB)
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'bundle' || github.ref_type == 'tag' }}
        continue-on-error: true
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ inputs.version_code || '1' }} \
            -PversionName=${{ inputs.version_name || '1.0.0' }} \
            --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feathered-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Feathered-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 📤 Upload Google Play Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Feathered-GooglePlay-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: 🏷️ Publish GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
